<!doctype html>
<!-- 忆梦云团队开发 -->
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title><meta name="application-name" content=""><meta name="version" content="1.2.0"><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<header class="header"><span id="accountWelcome" class="brand">欢迎你</span><nav class="header-actions"><button id="logoutAccount" class="nav-button logout-button" type="button">退出登录</button></nav></header>
<nav class="customer-service-entry"><button id="showCustomerService" class="nav-button" type="button">客服联系方式</button></nav>
<nav class="page-tabs"><button id="showShop" class="nav-button active" type="button">商品</button><button id="showOrders" class="nav-button" type="button">我的订单</button></nav>
<main id="shopView" class="layout"><section class="panel"><div class="section-head"><div><span>01</span><h2>选择分类</h2></div><input id="search" type="search" placeholder="搜索商品"></div><div id="categories" class="categories"><div class="skeleton short"></div></div></section><section class="panel"><div class="section-head"><div><span>02</span><h2>选择商品</h2></div></div><div id="goods" class="goods-grid"><div class="skeleton"></div></div></section><section id="checkout" class="panel checkout hidden"><div class="section-head"><div><span>03</span><h2>确认并支付</h2></div></div><div class="checkout-grid"><div class="summary"><img id="chosenImage" class="hidden" alt="商品图片"><div><small>已选商品</small><h3 id="chosenName"></h3><p id="chosenDescription" class="chosen-description"></p><strong id="chosenPrice"></strong></div></div><div class="form"><label>购买数量<input id="quantity" type="number" min="1" max="100" value="1"></label><label>联系方式<input id="contact" type="text" maxlength="11" readonly><small class="locked-hint">已锁定为本地账号手机号。</small></label><fieldset><legend>支付方式</legend><div id="channels" class="channels"></div></fieldset><div class="total"><span>应付金额</span><strong id="total">—</strong></div><button id="payButton" class="pay" type="button">去支付</button><p id="message" class="message" role="alert"></p></div></div></section></main>
<main id="ordersView" class="layout hidden"><section class="orders-hero"><div><span class="badge">账号订单中心</span><h1>我的订单</h1><p>验证一次后查询当前账号的全部订单。</p></div><button id="refreshOrders" class="refresh-button" type="button">刷新订单</button></section><p id="ordersMessage" class="message"></p><section id="ordersList" class="orders-list"></section></main>
<div id="announcementModal" class="modal announcement-modal hidden" role="dialog" aria-modal="true" aria-labelledby="announcementTitle"><div class="modal-card announcement-card"><button id="closeAnnouncement" class="close" type="button" aria-label="关闭公告">×</button><h2 id="announcementTitle">店铺公告</h2><div id="announcementText" class="announcement-text"></div><button id="confirmAnnouncement" class="pay announcement-confirm" type="button">我知道了</button></div></div><div id="customerServiceModal" class="modal customer-service-modal hidden" role="dialog" aria-modal="true" aria-labelledby="customerServiceTitle"><div class="modal-card customer-service-card"><button id="closeCustomerService" class="close" type="button" aria-label="关闭客服联系方式">×</button><h2 id="customerServiceTitle">客服联系方式</h2><div id="shopContact" class="shop-contact"><div class="contact-row"><span>QQ号：</span><strong id="shopContactQq"></strong></div><div class="contact-row"><span>手机号/微信号：</span><strong id="shopContactMobile"></strong></div><div class="contact-row contact-action-row"><a id="shopContactLink" class="customer-service-link" target="_blank" rel="noopener noreferrer"></a></div></div></div></div><div id="orderLoadingModal" class="modal hidden"><div class="modal-card loading-card"><div class="order-spinner"></div><h2>正在创建订单</h2><p id="orderLoadingText" class="muted">正在连接支付平台，请稍候…</p></div></div><div id="paymentModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><span class="modal-icon">¥</span><h2>请扫码完成支付</h2><p id="orderText" class="muted"></p><div id="paymentBrowser" class="payment-browser"><div class="payment-browser-bar"><i></i><span id="paymentBrowserUrl">Node.js 后端正在解析最终收款码…</span></div></div><div id="qrImage" class="qr hidden"></div><div class="status"><i></i><span id="payStatus">等待支付中</span></div></div></div>
<div id="orderModal" class="modal hidden"><div class="modal-card order-detail-card"><button id="closeOrderModal" class="close">×</button><h2>订单详情</h2><div id="orderDetail"></div></div></div><div id="accountModal" class="modal hidden"><div class="modal-card account-card"><h2>创建本地账号</h2><p class="muted">请输入手机号作为下单联系方式。</p><input id="accountPhone" class="captcha-input" maxlength="11" placeholder="请输入11位手机号"><button id="accountSubmit" class="pay">创建账号</button><p id="accountMessage" class="message"></p><div id="accountHistory" class="account-history hidden"><span>历史创建的账号</span><div id="accountHistoryList"></div></div></div></div><div id="captchaModal" class="modal hidden"><div class="modal-card captcha-card"><button id="closeCaptchaModal" class="close">×</button><h2>请输入验证码</h2><p class="muted">完成验证后查询订单</p><img id="captchaImage" class="captcha-image" alt="验证码"><input id="captchaCode" class="captcha-input" maxlength="10"><button id="captchaSubmit" class="pay">确认验证</button><p id="captchaMessage" class="message"></p></div></div>
<script src="assets/js/qrcode.min.js"></script><script src="assets/js/app.js"></script></body></html>
