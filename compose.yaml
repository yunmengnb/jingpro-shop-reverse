# 忆梦云团队开发
services:
  shop:
    build: .
    container_name: yimengyun-shop-node
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      PORT: 3000
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  nginx:
    image: nginx:alpine
    container_name: yimengyun-shop-nginx
    restart: unless-stopped
    depends_on:
      - shop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
